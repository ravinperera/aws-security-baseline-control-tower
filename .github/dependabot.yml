version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: terraform
    directory: /terraform/iam-identity-center
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /terraform/logging-baseline
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /terraform/security-controls
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - terraform
